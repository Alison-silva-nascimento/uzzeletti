<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contato | UZZELETTI</title><meta name="description" content="Entre em contato com a UZZELETTI."><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/header.css"><link rel="stylesheet" href="css/footer.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/products.css"><link rel="stylesheet" href="css/responsive.css"></head><body><div data-header></div><main id="conteudo"><header class="page-hero"><div class="container"><span class="eyebrow">Vamos conversar</span><h1 class="page-title">Contato</h1></div></header><section class="section"><div class="container contact-grid"><div><div class="contact-card"><span>WhatsApp</span><strong>Contato oficial pendente</strong></div><div class="contact-card"><span>Instagram</span><strong>Perfil oficial pendente</strong></div><div class="contact-card"><span>Endereço</span><strong>Informação pendente</strong></div><div class="contact-card"><span>Atendimento</span><strong>Horários pendentes</strong></div></div><form class="form" id="contact-form"><label>Nome<input required name="name" autocomplete="name" placeholder="Seu nome"></label><label>E-mail<input required type="email" name="email" autocomplete="email" placeholder="voce@exemplo.com"></label><label>Assunto<input required id="subject" name="subject" placeholder="Como podemos ajudar?"></label><label>Mensagem<textarea required name="message" placeholder="Escreva sua mensagem"></textarea></label><button class="btn" type="submit">Enviar mensagem</button><p id="form-status" class="muted" tabindex="-1" aria-live="polite"></p></form></div></section></main><div data-footer></div><script src="js/app.js"></script><script src="js/contact.js"></script></body></html>
